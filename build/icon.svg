<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Grabby app icon (source). Rendered to build/icon.png by scripts/gen-app-icon.cjs;
       electron-builder turns that into the .icns / .ico. macOS grid: 824px body, 100px margin. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.55" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0b2a6b" flood-opacity="0.40"/>
    </filter>
  </defs>

  <g filter="url(#drop)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#body)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sheen)"/>
  <rect x="101" y="101" width="822" height="822" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>

  <g filter="url(#lift)" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- arrow -->
    <path d="M512 262 V592" stroke-width="92"/>
    <path d="M356 452 L512 608 L668 452" stroke-width="92"/>
    <!-- tray -->
    <path d="M292 632 V706 Q292 768 354 768 H670 Q732 768 732 706 V632" stroke-width="68"/>
  </g>
</svg>
